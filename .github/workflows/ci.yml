name: ThreatScope CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: this workflow only reads the repository.
# It installs dependencies and runs tests; it publishes nothing.
permissions:
  contents: read

jobs:
  # Validates the current web application (app.py / cli.py / core/)
  # on every supported Python version.
  current:
    name: Current application (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      # actions/checkout v7 (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python v7 (v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile application modules and tests
        run: python -m compileall app.py cli.py config.py core export intel ai parsers tests

      # Add new current-application test modules to this command.
      # Legacy desktop GUI checks live in the separate `legacy` job.
      - name: Run current-application tests
        run: python -m unittest tests.test_analyzer_patterns tests.test_cli tests.test_flask_app -v

  # Compatibility checks for the separate legacy desktop GUI
  # (ThreatscopeX.py, version 1.0, 308 rules). These checks do NOT
  # validate app.py or cli.py, and the GUI is never launched here.
  legacy:
    name: Legacy desktop GUI checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7 (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        # actions/setup-python v7 (v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run legacy compatibility checks
        run: python -m unittest tests.test_legacy -v
